# What Cindrasec publishes about itself, copied from its own site.
#
# **This file is evidence, not intent.** It is not the place to write what we wish
# were true, or what was said in a chat, or what the pricing will be next month. It
# records what cindrasec.com actually publishes, so that every prospect-facing claim
# this pipeline makes can be checked against something rather than trusted.
#
# **Read the page, not only the structured data.** This file was first written from
# `schema.org` `makesOffer` alone, which lists the Snapshot at $250-$600 and encodes no
# free tier -- so `scoring.yaml`'s `snapshot_free: {free: true}` was declared false, the
# free offer was stripped out of all four phrases, and every card started quoting a
# price instead. The page says "first Snapshot free" in **fourteen** places: the meta
# description, the hero CTA, a pill on the Snapshot card, the assurance strip, a whole
# Founding Cohort section, the pricing banner, the FAQ and the billing note. The flag
# was right; only its *precision* was wrong.
#
# `makesOffer` carries list prices. A cohort promotion is not a list price, and absence
# from one machine-readable block is not absence from the business. The lesson is the
# one this project keeps paying for in a new costume: **a single source checked
# confidently is still a single source.**
#
# The condition is the part that has to survive: it is the *first* Snapshot, for
# founding-cohort clients, while pilot slots last. When the cohort closes, set
# `first_free: false` here and every card stops offering it in the same deploy.
#
# `test_the_free_flag_is_backed_by_the_site` ties `scoring.yaml`'s flag to this file in
# both directions, so neither can be edited alone.
#
# To refresh, read the *page*, not just the JSON-LD:
#   curl -s https://cindrasec.com/ | grep -o -i '[^>]*free[^<]*' | grep -vi font
#   curl -s https://cindrasec.com/ | grep -A40 '"makesOffer"'

source: https://cindrasec.com/
source_kind: schema.org ProfessionalService, makesOffer (JSON-LD)
extracted_at: 2026-09-15
price_range: $150-$8000

# Keyed by the `Offer` literal in `models.py`. Every slug must appear here and in
# `scoring.yaml`, in both directions -- a test asserts it, because an offer missing
# from this file is one with no published price behind it.
#
# NOTE on the `snapshot_free` key: the slug is historical and the product is **not**
# free. It is kept because `leads.recommended_offer` stores it on every scored row and
# renaming it is a migration rather than an edit. The name is a trap for the next
# reader, which is exactly why the price sits directly under it.
offers:
  snapshot_free:
    site_name: Snapshot - one-time attack-surface scan
    currency: USD
    min_price: 250
    max_price: 600
    bdt: 15,000-25,000
    delivery: report in 3-5 working days
    # The list price is not what a *first* prospect pays, and every lead this pipeline
    # writes to is a first prospect. See the note above on why this field exists.
    first_free: true
    first_free_condition: >-
      founding-cohort clients only, while pilot slots last, under a signed RoE - no
      card and no obligation to continue
    first_free_source: https://cindrasec.com/#pricing
  watch:
    site_name: Watch - continuous monitoring subscription
    currency: USD
    min_price: 150
    max_price: 500
    unit: MONTH
    bdt: 5,000-12,000 per month
    first_free: false
  ai_llm_assessment:
    site_name: AI/LLM Security Assessment
    currency: USD
    min_price: 2000
    max_price: 8000
    bdt: 40,000-1,50,000
    delivery: 2-5 days
    first_free: false
  gig:
    site_name: Productized Gig - fixed-scope quick check
    currency: USD
    min_price: 150
    max_price: 500
    bdt: 7,000-15,000
    delivery: 2-4 hrs
    first_free: false

# ---------------------------------------------------------------------------
# What we can honestly say we have done, matched to what the prospect is doing.
#
# The card asks a stranger to pay $250-$8000 on the strength of nothing: the outreach
# prompt described us as "a B2B security studio" and stopped there. Meanwhile two
# pieces of third-party-verifiable work sat published on our own site and reached no
# prospect. For cold outreach from an unknown studio that is the single largest lever
# there is, and it costs ~40 prompt tokens against a 3.7 tok/s decode -- prefill is 42
# tok/s, so specificity at this end is close to free.
#
# **Every claim here is deliberately under-stated, and that is load-bearing.** The
# Photomath writeup spends its length explaining why a $0 reward was the *correct*
# decision and why "reachable through Google" is not "run by Google". A card reading
# "we found a critical vulnerability in Google" would contradict our own published
# analysis, in writing, to someone who can click the link and read it. So: no
# "critical", no payout implied, no adjectives the badge does not carry.
#
# `evidences` and `surfaces` decide which proof a lead gets. The match is the point --
# a company that just shipped an agent gets the prompt-injection measurement, and a
# company with subdomain sprawl gets the finding that *was itself* a forgotten
# subdomain of an acquisition. Generic proof is nearly worthless; the same sentence
# aimed at the reason we are writing is not.
# ---------------------------------------------------------------------------
proof:
  # Checked before the others, because for a healthtech prospect this outweighs any
  # amount of generic security credibility -- and it is not a claim anyone else can
  # make. `icp.yaml` has listed healthtech as primary ICP for the life of the project
  # while the single most differentiating sentence in the business reached no card.
  healthcare:
    industries: [health, clinic, hospital, medical, patient, diagnostic, pharma, ehr]
    evidences: []
    surfaces: []
    claim: >-
      the person who runs these assessments is a registered nurse turned security
      researcher, so a clinical system gets reviewed by someone who has actually
      worked one
    url: https://cindrasec.com/healthcare/
  ai_llm:
    evidences: [T1_AI_SHIP, T4_HIRING_AI_ONLY]
    surfaces: [agent_with_tools, mcp_server, chatbot, llm_feature, rag_pipeline]
    claim: >-
      we publish our own prompt-injection measurements -- 256 trials per attack against
      a self-hosted model, where the same technique swung 4.6x in success rate purely
      by changing what the attacker asked for
    url: https://cindrasec.com/research/2026-07-prompt-injection-content-dependent/
  attack_surface:
    evidences: [T7_SURFACE_SPRAWL, T8_HYGIENE_GAP, T11_STACK_RISK]
    surfaces: []
    claim: >-
      we reported an authentication bypass on a forgotten subdomain of a Google
      acquisition through their VRP, triaged P2/S2 and decommissioned nine days later
    url: https://cindrasec.com/research/2026-05-exposed-iam-frontend-google-vrp/

# The permission promise, in the words the signed document actually uses.
#
# Rule 5 of `outreach_angle.md` is the one constraint here that is *legal* rather than
# editorial, and it was a paraphrase written from memory -- the same failure mode as
# the free-offer defect, on a more serious claim. These lines are from
# `legal/Rules-of-Engagement.md`, RoE version 3.0.
roe:
  version: "3.0"
  url: https://cindrasec.com/legal/Rules-of-Engagement
  promise: Nothing is scanned until both parties sign.
  passive_first: Passive-first - your systems are not modified or taken offline.
  revocable: >-
    You can revoke this permission in writing at any time - testing stops at once.
  found_not_tested: >-
    New assets found while testing are reported, not tested, until added to the scope
    in writing.
  promise_bn: স্বাক্ষর ছাড়া কোনো স্ক্যান নয়।

# Who we are, in the words the site uses. The outreach prompt describes us to a
# prospect and had none of this -- it said "a B2B security studio" and nothing else.
identity:
  name: Cindrasec
  founder: Md. Azmol Haque Rony
  contact: contact@cindrasec.com
  founded: 2025-07
  location: Dhaka, Bangladesh
  area_served: [Bangladesh, Worldwide]
  languages: [en, bn]
  slogan: We find the spark before it becomes a fire.
  description: >-
    Cindrasec is an automation-first security studio providing attack-surface
    monitoring and AI/LLM security testing for founders and SMEs in Bangladesh and
    worldwide.
