# Who we are looking for, and the queries that find them.
#
# Edit this file, not scout.py. Adding a way to find prospects is a template row here.
#
# Query templates are ordered by `weight`, highest first, and the Scout spends free
# sources before it spends a SerpAPI credit (PLAN.md decision 7). A template that costs
# nothing and finds one good company beats a paid one that finds three.

profile:
  primary:
    - Seed/Series-A SaaS, fintech, healthtech: 5-150 employees, no dedicated security hire
    - Any team that shipped an LLM chatbot, AI agent, or MCP server in the last 180 days
    - Companies with visible surface sprawl: many subdomains, admin panels, staging hosts
  secondary:
    - Bangladesh + South Asia SMEs with public web apps (local-trust wedge, BDT pricing)
    - Agencies and dev shops who could white-label Snapshot for their own clients
    - Marketplace buyers actively posting pentest/AppSec briefs

  # HARD EXCLUDE. The ComplianceGate turns these into vetoes in Phase 5; the Scout
  # uses them earlier, to avoid spending a credit discovering someone we must reject.
  anti_icp:
    max_employees: 1000
    exclude_sectors:
      - government
      - defence
      - critical national infrastructure
      - security vendor
      - penetration testing firm
    exclude_domains: [] # seeded from the suppression list at runtime
    notes: >
      Enterprises with a named CISO and an in-house red team are not prospects, they
      are competitors' customers. Individuals with no business affiliation are out:
      this is B2B only.

geography:
  # 60/40 global vs BD+South Asia. Weights, not filters -- a strong global lead still
  # beats a weak local one.
  weights:
    global: 0.6
    bd_south_asia: 0.4
  local_tlds: [".bd", ".com.bd", ".lk", ".np", ".pk", ".in"]

# ---------------------------------------------------------------------------
# Discovery query templates.
#
# `engine` is a source id from sources.yaml. `cost` is informational -- the Scout
# reads the real cost from the source registry -- but keeping it visible here makes
# the free-first ordering obvious when editing.
# ---------------------------------------------------------------------------

query_templates:
  # Ordered by weight, and the ordering is the fix.
  #
  # The first real corpus reached 148 companies, 82% of them carrying only T1_AI_SHIP,
  # and the names tell the story: Ultimate Tic-Tac-Toe, WorldClock, handwritten.blog.
  # Discovery was weighted toward sources that announce *projects* -- unfiltered Show
  # HN at 95, GitHub repo search at 88 -- and away from the ones that surface
  # *companies*: the HN hiring thread at 72, funding at 62, ATS boards rationed at 60.
  # With a 12-plan budget per run, the project sources consumed it before the company
  # sources were reached.
  #
  # The reweighting below asks one question of every template: does a hit here imply
  # the thing on the other end has employees and money? A public ATS board does. A
  # funding announcement does. A repo owned by an organisation usually does. A Show HN
  # post does not, and "shipped an AI thing" is not evidence of being a company.
  #
  # Show HN is kept, not deleted -- it is genuinely where a small funded team announces
  # a launch, and it is free. It is simply no longer first in the queue.

  # ---- company-shaped and free: someone is hiring, so someone is paying ------
  # `comments: true` is what makes this template work at all, and it was demoted to 20
  # for one day without it. Measured then: 19 hits, 16 dropped as platform URLs, 0
  # candidates, on every run it had ever made.
  #
  # "Ask HN: Who is hiring" is *one thread*. Its story URL is news.ycombinator.com and
  # the companies are in the replies, so the only URL on offer was the platform's and
  # the drop rule correctly threw it away. Compare `hn_show_ai`, which converts 100 hits
  # into 35 candidates: a Show HN story carries an external `url` pointing at the
  # product's own site. The distinction was never the source, it was whether a hit
  # carries a company's own domain.
  #
  # With the flag, a hit is a *comment*: its HN permalink is the evidence -- dated,
  # public, quotable -- and the company URL inside it is what gets extracted. Restored
  # to 96 because the original premise holds and is now reachable: every entry in this
  # thread is a company with payroll, which is the strongest free company filter there
  # is. `since_days: 120` covers three monthly threads; the Harvester reads at most
  # three and 40 comments from each, because each accepted comment is ~64 s of decode.
  #
  # `tags: story,author_whoishiring` is the other half, and without it the rest is
  # pointless. `query` is full text, so "Ask HN Who is hiring" matched any Ask HN post
  # sharing those words -- measured live: "Who wants to fund DB research?", "Have you
  # worked with anyone from HN?", "Do you know how much head hunters cost?". This
  # template had never once found the hiring thread, which is the real reason it
  # produced nothing; the comment mechanism alone would have read the comments of the
  # wrong threads. The thread is posted monthly by the `whoishiring` bot, so filtering
  # on the author selects it exactly and the query text picks the hiring one out of
  # that account's three monthly posts.
  - id: hn_who_is_hiring
    engine: hn_algolia
    query: Who is hiring
    tags: story,author_whoishiring
    since_days: 120
    comments: true
    targets: [T3_HIRING_SEC, T4_HIRING_AI_ONLY]
    weight: 96

  - id: hn_hiring_ai_roles
    engine: hn_algolia
    query: hiring "AI engineer" OR "ML engineer" OR "LLM" remote
    since_days: 45
    targets: [T4_HIRING_AI_ONLY, T1_AI_SHIP]
    weight: 92
    rationale: >
      A company paying for AI engineers is shipping AI and has budget, which is the
      ICP in one query. Narrower than the monthly thread and catches off-cycle posts.

  - id: hn_funding
    engine: hn_algolia
    query: raises seed OR "Series A" OR "we raised"
    since_days: 90
    targets: [T2_FUNDING]
    weight: 90
    rationale: >
      Raised money means investors, a board and runway -- and it dates the event, which
      is what makes a trigger a reason to call this month. T2 fired 9 times in 148
      companies; it should be one of the commonest triggers, not one of the rarest.

  # ---- company-shaped and free: org-owned code -------------------------------
  # `organizations_only` is on by default in the harvester, so these return repos owned
  # by an organisation rather than a person. That filter existed only in a docstring
  # until it was found missing; every personal langchain project was a candidate.

  - id: gh_mcp_servers
    engine: github_api
    query: mcp-server language:python
    since_days: 120
    targets: [T1_AI_SHIP, T11_STACK_RISK]
    weight: 86
    rationale: An MCP server in org-owned code is a concrete, dated AI surface.

  - id: gh_agent_frameworks
    engine: github_api
    query: langchain OR llamaindex OR autogen OR crewai
    since_days: 180
    targets: [T11_STACK_RISK]
    weight: 78
    rationale: Agent frameworks in org-owned repos.

  - id: gh_ai_products
    engine: github_api
    query: chatbot OR "ai assistant" stars:>100
    since_days: 90
    targets: [T1_AI_SHIP]
    weight: 60
    rationale: >
      Was `stars:>10`, which is a weekend project with friends. 100 stars on an
      org-owned repo is a product with users. Renamed from `gh_ai_startups` because
      the old id described what it was hoped to find, not what it found.

  # ---- free, but a project until proven otherwise ---------------------------
  # Demoted rather than removed. These do surface real companies; they just surface
  # ten side projects for each one, and they were consuming the plan budget first.

  - id: hn_show_ai
    engine: hn_algolia
    tags: show_hn
    query: ""
    since_days: 30
    targets: [T1_AI_SHIP]
    weight: 55
    rationale: >
      Show HN, unfiltered. Was weight 95 and the single largest source of side
      projects in the corpus -- a tic-tac-toe game and a world clock both arrived
      here. Kept because a funded team announcing a launch is a genuine T1, and it
      costs nothing; demoted because most posts are one person's weekend.

  - id: hn_ai_agent
    engine: hn_algolia
    query: AI agent OR LLM chatbot OR MCP server
    since_days: 45
    targets: [T1_AI_SHIP, T11_STACK_RISK]
    weight: 52
    rationale: Teams describing an agent they shipped. Same caveat as Show HN.

  # ---- free: intent and context ---------------------------------------------

  - id: hn_pentest_pressure
    engine: hn_algolia
    query: SOC 2 OR penetration test OR security questionnaire
    since_days: 60
    targets: [T10_VENDOR_PRESSURE, T5_COMPLIANCE]
    weight: 82
    rationale: >
      Someone being asked for a pentest report by a customer is a company with
      customers, and high intent. No paid equivalent worth buying.

  - id: hn_incident
    engine: hn_algolia
    query: data breach OR security incident OR exposed database
    since_days: 45
    targets: [T6_INCIDENT]
    weight: 64
    rationale: >
      Disclosed incidents. The company itself is rarely the prospect; its sector peers
      are, and they are reading the same thread.

  - id: hn_south_asia
    engine: hn_algolia
    query: Bangladesh OR Dhaka OR Pakistan OR "Sri Lanka" startup funding
    since_days: 120
    targets: [T12_LOCAL, T2_FUNDING]
    weight: 58
    rationale: >
      The BD/South Asia local-trust wedge. `funding` added to the query: without it
      this returned discussion threads about the region rather than companies in it.

  # ---- rationed: only SerpAPI can do these ----------------------------------

  # RETIRED 2026-08-21. `site:upwork.com` returns Upwork URLs, and an Upwork client is
  # anonymous by design -- there is no company behind the posting to find. Every hit was
  # dropped as a platform URL: 10 hits, 10 dropped, 0 candidates, on every run it made.
  # At weight 98 it also won a plan slot and a credit ahead of templates that can work.
  #
  # The intent was sound -- someone shopping for exactly what we sell is the best signal
  # there is -- so it is worth rebuilding against a marketplace that names the buyer.
  # Restoring this query as written would only spend credits again.
  #
  # - id: serp_marketplace_pentest
  #   engine: serpapi_marketplace
  #   query: site:upwork.com "penetration test" posted
  #   targets: [T9_MARKETPLACE]
  #   weight: 98

  # REWRITTEN 2026-08-21. Was `site:boards.greenhouse.io ("AI engineer" OR "ML
  # engineer")`, which returned only Greenhouse board URLs -- 10 hits, 10 dropped as
  # platform URLs, 0 candidates, every run. The `site:` filter and the platform rule
  # contradicted each other, so it could never produce a lead.
  #
  # Not fixable by teaching the Harvester to read ATS URLs: the board API returns
  # `{"name": "GitLab", "content": ""}` and the jobs carry `company_name` but no
  # website, so a board slug cannot be resolved to a canonical domain without guessing.
  # An ATS board enriches a company we already found -- which `_boards()` already does.
  #
  # Inverted instead: exclude the platforms so what comes back is the company's own
  # careers page, on its own domain, which is both extractable and the thing that
  # implies payroll.
  - id: serp_jobs_ai_no_sec
    engine: serpapi_jobs
    query: >-
      ("AI engineer" OR "ML engineer" OR "LLM engineer") ("we are hiring" OR careers)
      -site:linkedin.com -site:indeed.com -site:glassdoor.com -site:greenhouse.io
      -site:lever.co -site:ashbyhq.com -site:workable.com -site:ziprecruiter.com
    targets: [T4_HIRING_AI_ONLY, T3_HIRING_SEC]
    weight: 94
    cost: 1
    rationale: >
      A public Greenhouse board is proof of payroll, and the role proves they are
      shipping AI. Raised from 60: with two costed plans per run this and the
      marketplace query are the two worth paying for, and a credit spent confirming a
      company exists is worth more than one spent finding another launch post.

  - id: serp_funding_bd
    engine: serpapi_news
    query: Bangladesh OR Dhaka startup raises seed funding
    targets: [T2_FUNDING, T12_LOCAL]
    weight: 55
    cost: 1
    rationale: BD/South Asia funding is poorly covered by the English-language RSS feeds.

scout:
  # How many plans one harvest run emits. Free templates are cheap, so the ceiling is
  # about how much extraction the Pi can chew through, not about the queries.
  max_plans_per_run: 12
  # At most this many rationed plans per run, on top of whatever the budget guard
  # allows. Belt and braces: the guard is the hard limit, this is the intent.
  max_costed_plans_per_run: 2
  # Do not re-run a query whose answer is still cached. The cache TTL per source is
  # the authority; this is just the Scout refusing to plan a guaranteed cache hit.
  skip_if_cached: true
