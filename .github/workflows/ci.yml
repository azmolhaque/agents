name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Typecheck
        run: mypy

      - name: Unit tests
        run: pytest tests/unit -q

      # The Phase 0 acceptance gate. Spawns real workers and SIGKILLs them, so it
      # needs a real process table - it cannot be collapsed into the unit run.
      - name: Durability drill (Phase 0 gate)
        run: pytest tests/integration -q
