# /etc/systemd/system/ollama.service.d/override.conf
#
# Install:
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo cp deploy/ollama-override.conf /etc/systemd/system/ollama.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# Verify it took effect:
#   systemctl show ollama -p Environment

[Service]
# Two models resident: workhorse + embedder (~4.0 GB against a 6.5 GB envelope).
# PLAN.md 2.2 dropped the third (router) model precisely so this can stay at 2 without
# thrashing. If you add a third model, raise this AND re-check the memory envelope --
# leaving it at 2 with three models in rotation is the worst of both worlds.
Environment="OLLAMA_MAX_LOADED_MODELS=2"

# One request at a time. Four Python workers sharing one 4-core SoC will already
# saturate it; parallel decode just adds context-switching and heat.
Environment="OLLAMA_NUM_PARALLEL=1"

# Keep models warm between pipeline stages. A cold 2.8 GB load from NVMe costs more
# than the RAM it saves, given the harvest timer fires hourly.
Environment="OLLAMA_KEEP_ALIVE=30m"

Environment="OLLAMA_FLASH_ATTENTION=1"

# q8_0 KV cache roughly halves cache memory at negligible quality cost, which is what
# buys the headroom for the embedder to stay resident alongside the workhorse.
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"

# Bind to localhost only. Nothing outside the Pi should reach the model server.
Environment="OLLAMA_HOST=127.0.0.1:11434"
